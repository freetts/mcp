<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeTTS player</title>
<meta name="freetts-player" content="2.2">
<style>
:root{
  --bg:#ffffff;--sheen:#f3faf6;--ink:#0d1512;--ink2:#4f5d57;--muted:#7a8781;--line:#e4ebe7;
  --bar:#d5e0db;--bar-hover:#9fd9bf;--accent:#0a9a6a;--accent-2:#057a52;--on-accent:#ffffff;
  --chip:#f4f8f6;--chip-h:#eaf5ef;--seg:#eef3f0;--seg-on:#ffffff;--err:#b42318;--shadow:0 8px 22px rgba(5,122,82,.22)
}
:root[data-theme="dark"]{
  --bg:#101614;--sheen:#13201b;--ink:#eef4f1;--ink2:#b3c0ba;--muted:#83928b;--line:#243029;
  --bar:#2c3a34;--bar-hover:#2f6f55;--accent:#34d399;--accent-2:#10b981;--on-accent:#03140c;
  --chip:#17201c;--chip-h:#1b2b24;--seg:#18221e;--seg-on:#26332d;--err:#f97066;--shadow:0 8px 24px rgba(16,185,129,.24)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:transparent}
body{font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.card{position:relative;background:linear-gradient(180deg,var(--sheen),var(--bg) 70%);padding:16px 18px 14px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:16px}
.play{flex:none;position:relative;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(145deg,var(--accent),var(--accent-2));box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}
.play:hover{transform:scale(1.04)}
.play:active{transform:scale(.97)}
.play svg{width:22px;height:22px}
.play .ip{margin-left:3px}
.play[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:none}
.play.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.wave{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:2px;cursor:pointer;touch-action:none;position:relative;outline:none;border-radius:8px}
.wave:focus-visible{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}
.wave i{flex:1;min-width:1px;border-radius:3px;background:var(--bar);transition:background-color .12s ease,transform .2s ease;transform-origin:center}
.wave i.p{background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.wave i.h{background:var(--bar-hover)}
.wave.flat i{height:4px!important}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.names{min-width:0;display:flex;flex-direction:column}
.nm{display:flex;align-items:center;gap:7px;min-width:0}
.voice{font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:2px 7px}
.lang{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.time{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:2px}
.time b{color:var(--ink);font-weight:700}
.seg{display:flex;background:var(--seg);border-radius:10px;padding:3px;gap:2px}
.spd{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:5px 8px;border-radius:7px;cursor:pointer;font-variant-numeric:tabular-nums;transition:color .12s,background .12s}
.spd:hover{color:var(--ink)}
.spd[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dl{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer;transition:border-color .12s,color .12s,transform .12s}
.dl:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent);transform:translateY(-1px)}
.dl svg{width:16px;height:16px}
.alts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.alts-l{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:3px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);font-size:12.5px;font-weight:650;padding:4px 11px 4px 4px;border-radius:999px;cursor:pointer;transition:background .14s,border-color .14s,transform .14s}
.chip:hover{background:var(--chip-h);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));transform:translateY(-1px)}
.chip .av{width:22px;height:22px;font-size:10.5px}
.chip .g{color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.chip[disabled]{opacity:.5;cursor:default;transform:none}
.chip.busy{opacity:1}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{font-size:12.5px;color:var(--muted)}
.msg:empty{display:none}
.msg.err{color:var(--err)}
.loading{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13.5px;padding:6px 0}
.loading .bars{display:flex;gap:3px;align-items:center;height:22px}
.loading .bars i{width:4px;border-radius:3px;background:var(--accent);animation:eq 1s ease-in-out infinite}
.loading .bars i:nth-child(2){animation-delay:.15s}.loading .bars i:nth-child(3){animation-delay:.3s}.loading .bars i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px;opacity:.6}50%{height:22px;opacity:1}}
.brand{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.75}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wave:focus-visible{outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:460px){
  .card{padding:14px 14px 12px;gap:12px}
  .top{gap:12px}.play{width:48px;height:48px}.wave{height:46px;gap:1.5px}
  .meta{gap:10px}.who{flex-basis:100%}.ctl{width:100%;justify-content:space-between}
}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading" id="loading"><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="loadingText">Recording the audio</span></div>
  <div class="top" id="top" hidden>
    <button class="play" id="play" type="button" aria-label="Play" disabled>
      <svg class="ip" id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5.2v13.6c0 .8.86 1.28 1.54.87l10.9-6.8a1 1 0 0 0 0-1.74L8.54 4.33A1 1 0 0 0 7 5.2z"/></svg>
      <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="6" y="4.5" width="4.4" height="15" rx="1.3"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.3"/></svg>
    </button>
    <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>
  <div class="meta" id="meta" hidden>
    <div class="who">
      <span class="av" id="av" aria-hidden="true"></span>
      <div class="names">
        <div class="nm"><span class="voice" id="voice"></span><span class="tag" id="tag" hidden></span></div>
        <span class="lang" id="lang"></span>
      </div>
    </div>
    <div class="ctl">
      <span class="time" id="time"><b id="cur">0:00</b> / <span id="dur">0:00</span></span>
      <div class="seg" role="group" aria-label="Playback speed">
        <button class="spd" type="button" data-r="0.75" aria-pressed="false">0.75×</button>
        <button class="spd" type="button" data-r="1" aria-pressed="true">1×</button>
        <button class="spd" type="button" data-r="1.25" aria-pressed="false">1.25×</button>
        <button class="spd" type="button" data-r="1.5" aria-pressed="false">1.5×</button>
      </div>
      <button class="dl" id="dl" type="button" aria-label="Download" title="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 20h14"/></svg></button>
    </div>
  </div>
  <div class="alts" id="alts" hidden><span class="alts-l">Hear it in</span></div>
  <div class="msg" id="msg" aria-live="polite"></div>
</div>
<audio id="au" preload="metadata"></audio>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var au=$("au"),wave=$("wave"),state=null,input=null,rate=1,busy=false,dragging=false,bars=[],raf=0;
  var oa=window.openai||null;

  // ── host bridge (MCP Apps, with ChatGPT's window.openai as a fallback) ───
  var rid=0,pend={};
  function rpc(method,params){
    var id=++rid;
    return new Promise(function(res,rej){
      pend[id]={res:res,rej:rej};
      try{window.parent.postMessage({jsonrpc:"2.0",id:id,method:method,params:params||{}},"*")}catch(e){delete pend[id];rej(e);return}
      setTimeout(function(){if(pend[id]){delete pend[id];rej(new Error("timeout"))}},120000);
    });
  }
  function notify(method,params){try{window.parent.postMessage({jsonrpc:"2.0",method:method,params:params||{}},"*")}catch(e){}}
  window.addEventListener("message",function(ev){
    if(ev.source!==window.parent)return;
    var m=ev.data;if(!m||typeof m!=="object")return;
    if(m.id!=null&&pend[m.id]&&("result" in m||"error" in m)){var p=pend[m.id];delete pend[m.id];m.error?p.rej(m.error):p.res(m.result);return}
    if(m.method==="ui/notifications/tool-input"&&m.params){gotTI=true;input=m.params.arguments||input;renderAlts()}
    else if(m.method==="ui/notifications/tool-result"&&m.params){gotTR=true;if(m.params._meta)gotMeta=true;takeMeta(m.params._meta);show(m.params.structuredContent,m.params)}
    else if(m.method==="ui/notifications/host-context-changed"&&m.params){theme(m.params.theme)}
  });
  function theme(t){if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}
  // The text we rendered rides in the result's _meta too, so the voice chips
  // work even when the host never sends tool-input.
  function takeMeta(meta){var fi=meta&&meta["freetts/input"];if(fi&&typeof fi.text==="string"&&!input){input=fi;renderAlts()}}
  var gotTI=false,gotMeta=false,gotTR=false,sent=false;
  function beacon(){
    if(sent)return;sent=true;
    try{
      var o=window.openai||{};var keys=[];for(var k in o){keys.push(k)}
      var c=document.getElementById("card");
      var q="v=2.2&ti="+(gotTI?1:0)+"&meta="+(gotMeta?1:0)+"&tr="+(gotTR?1:0)+"&input="+(input?1:0)+"&alts="+((state&&state.alternatives)?state.alternatives.length:-1)
        +"&oa="+encodeURIComponent(keys.slice(0,40).join(","))+"&dm="+encodeURIComponent(String(o.displayMode||""))+"&mh="+encodeURIComponent(String(o.maxHeight||""))
        +"&ih="+window.innerHeight+"&ch="+(c?Math.round(c.getBoundingClientRect().height):0)+"&ua="+encodeURIComponent(navigator.userAgent.slice(0,60));
      var img=new Image();img.src="https://mcp.freetts.org/diag.gif?"+q;
    }catch(e){}
  }
  setTimeout(beacon,4000);
  if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)theme("dark");
  rpc("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"FreeTTS player",version:"1.1.0"},clientInfo:{name:"FreeTTS player",version:"1.1.0"},appCapabilities:{},capabilities:{}})
    .then(function(r){if(r&&r.hostContext)theme(r.hostContext.theme);notify("ui/notifications/initialized",{})})
    .catch(function(){});
  function fromOpenAI(){
    oa=window.openai||oa;if(!oa)return;
    if(oa.theme)theme(oa.theme);
    if(oa.toolInput&&typeof oa.toolInput.text==="string"){gotTI=true;if(!input){input=oa.toolInput;renderAlts()}}
    if(oa.toolResponseMetadata){gotMeta=true;takeMeta(oa.toolResponseMetadata)}
    if(oa.toolOutput&&!state)show(oa.toolOutput,null);
  }
  window.addEventListener("openai:set_globals",fromOpenAI);
  fromOpenAI();
  function callTool(name,args){
    if(oa&&typeof oa.callTool==="function")return oa.callTool(name,args);
    return rpc("tools/call",{name:name,arguments:args});
  }
  function openLink(url){
    if(oa&&typeof oa.openExternal==="function"){try{oa.openExternal({href:url});return}catch(e){}}
    rpc("ui/open-link",{url:url}).catch(function(){try{window.open(url,"_blank","noopener")}catch(e){}});
  }
  var lastH=0;
  function size(){var c=document.getElementById("card");var h=Math.ceil(c?c.getBoundingClientRect().height:document.body.scrollHeight);if(h&&h!==lastH){lastH=h;notify("ui/notifications/size-changed",{width:Math.ceil(document.documentElement.clientWidth||c.getBoundingClientRect().width),height:h});if(oa&&typeof oa.notifyIntrinsicHeight==="function"){try{oa.notifyIntrinsicHeight(h)}catch(e){}}}}
  if(window.ResizeObserver)new ResizeObserver(size).observe(document.getElementById("card"));

  // ── look ────────────────────────────────────────────────────────────────
  function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360}
  function paintAvatar(el,name){var h=hue(name||"FreeTTS");el.style.background="linear-gradient(140deg,hsl("+h+" 68% 52%),hsl("+((h+48)%360)+" 70% 40%))";el.textContent=(name||"?").charAt(0).toUpperCase()}
  function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
  function msg(t,err){var m=$("msg");m.textContent=t||"";m.className="msg"+(err?" err":"");size()}
  function isStd(t){return !t||String(t).indexOf("Standard")===0}
  function buildWave(peaks){
    wave.innerHTML="";bars=[];
    var n=peaks&&peaks.length?peaks.length:72;
    wave.classList.toggle("flat",!(peaks&&peaks.length));
    for(var i=0;i<n;i++){var b=document.createElement("i");var v=peaks&&peaks.length?Math.max(.08,Math.min(1,+peaks[i]||0)):.1;b.style.height=Math.round(v*100)+"%";wave.appendChild(b);bars.push(b)}
  }

  // ── state ───────────────────────────────────────────────────────────────
  function show(sc,raw){
    if(!sc||!sc.url){
      var t=raw&&raw.content&&raw.content[0]&&raw.content[0].text;
      if(t){$("loading").hidden=false;$("loading").querySelector(".bars").style.display="none";$("loadingText").textContent=t}
      size();return;
    }
    state=sc;
    $("loading").hidden=true;$("top").hidden=false;$("meta").hidden=false;
    var name=sc.voice_name||sc.voice||"FreeTTS";
    $("voice").textContent=name;paintAvatar($("av"),name);
    var tag=isStd(sc.tier)?"":sc.tier;$("tag").textContent=tag;$("tag").hidden=!tag;
    $("lang").textContent=sc.language||"";
    $("dl").setAttribute("aria-label","Download "+String(sc.format||"mp3").toUpperCase());
    $("dl").title="Download "+String(sc.format||"mp3").toUpperCase();
    buildWave(sc.peaks);
    au.src=sc.url;au.playbackRate=rate;
    $("play").disabled=false;
    $("dur").textContent=sc.seconds?fmt(sc.seconds):"0:00";
    paint(0);renderAlts();size();
  }
  function renderAlts(){
    var box=$("alts");
    while(box.children.length>1)box.removeChild(box.lastChild);
    var list=(state&&state.alternatives)||[];
    var text=input&&typeof input.text==="string"?input.text:"";
    if(!list.length||!text){box.hidden=true;size();return}
    list.forEach(function(a){
      var b=document.createElement("button");b.type="button";b.className="chip";
      var av=document.createElement("span");av.className="av";paintAvatar(av,a.name);b.appendChild(av);
      var n=document.createElement("span");n.textContent=a.name;b.appendChild(n);
      if(!isStd(a.tier)){var g=document.createElement("span");g.className="g";g.textContent=a.tier;b.appendChild(g)}
      b.setAttribute("aria-label","Hear it in "+a.name);
      b.addEventListener("click",function(){switchVoice(a,b,av)});
      box.appendChild(b);
    });
    var br=document.createElement("span");br.className="brand";br.setAttribute("aria-hidden","true");br.textContent="FreeTTS";box.appendChild(br);
    box.hidden=false;size();
  }
  function switchVoice(a,btn,av){
    if(busy||!input)return;
    busy=true;msg("");
    var chips=document.querySelectorAll(".chip");for(var i=0;i<chips.length;i++)chips[i].disabled=true;
    btn.classList.add("busy");
    var sp=document.createElement("span");sp.className="spin";av.replaceWith(sp);
    var args={text:input.text,voice:a.id};
    if(input.speed!=null)args.speed=input.speed;
    if(input.format)args.format=input.format;
    callTool("text_to_speech",args).then(function(r){
      var sc=r&&(r.structuredContent||(r.result&&r.result.structuredContent));
      if((r&&r.isError)||!sc||!sc.url){var t=r&&r.content&&r.content[0]&&r.content[0].text;msg(t||"That voice did not render. Try another one.",true);return}
      au.pause();show(sc,r);
      var p=au.play();if(p&&p.catch)p.catch(function(){});
    }).catch(function(){msg("That voice did not render. Try again in a moment.",true)})
    .then(function(){busy=false;if(sp.parentNode)sp.replaceWith(av);btn.classList.remove("busy");var c=document.querySelectorAll(".chip");for(var i=0;i<c.length;i++)c[i].disabled=false});
  }

  // ── transport ───────────────────────────────────────────────────────────
  function dur(){return isFinite(au.duration)&&au.duration>0?au.duration:(state&&state.seconds)||0}
  function paint(frac){
    var k=Math.round(frac*bars.length);
    for(var i=0;i<bars.length;i++){var on=i<k;if(bars[i]._p!==on){bars[i]._p=on;bars[i].classList.toggle("p",on)}}
    $("cur").textContent=fmt(au.currentTime);
    wave.setAttribute("aria-valuenow",String(Math.round(frac*100)));
    wave.setAttribute("aria-valuetext",fmt(au.currentTime)+" of "+fmt(dur()));
  }
  function loop(){var d=dur();if(!dragging)paint(d?au.currentTime/d:0);if(!au.paused)raf=requestAnimationFrame(loop)}
  function setIcon(){var on=!au.paused;$("icoPlay").toggleAttribute("hidden",on);$("icoPause").toggleAttribute("hidden",!on);$("play").classList.toggle("on",on);$("play").setAttribute("aria-label",on?"Pause":"Play")}
  $("play").addEventListener("click",function(){if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){msg("Playback was blocked. Press play again.",true)})}else au.pause()});
  au.addEventListener("play",function(){setIcon();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)});
  au.addEventListener("pause",function(){setIcon();loop()});
  au.addEventListener("ended",function(){setIcon();paint(1)});
  au.addEventListener("loadedmetadata",function(){if(isFinite(au.duration))$("dur").textContent=fmt(au.duration);loop()});
  au.addEventListener("seeked",loop);
  au.addEventListener("error",function(){if(state)msg("This audio link has expired. Ask again to make it once more.",true)});
  function fracAt(x){var r=wave.getBoundingClientRect();return Math.min(1,Math.max(0,(x-r.left)/r.width))}
  function hover(f){var k=f==null?-1:Math.round(f*bars.length);for(var i=0;i<bars.length;i++)bars[i].classList.toggle("h",k>=0&&i<k&&!bars[i]._p)}
  function seek(f){var d=dur();if(!d)return;au.currentTime=f*d;paint(f)}
  wave.addEventListener("pointerdown",function(e){dragging=true;try{wave.setPointerCapture(e.pointerId)}catch(x){}seek(fracAt(e.clientX))});
  wave.addEventListener("pointermove",function(e){var f=fracAt(e.clientX);if(dragging)seek(f);else if(e.pointerType==="mouse")hover(f)});
  wave.addEventListener("pointerleave",function(){hover(null)});
  function end(){dragging=false;hover(null)}
  wave.addEventListener("pointerup",end);wave.addEventListener("pointercancel",end);
  wave.addEventListener("keydown",function(e){var d=dur();if(!d)return;if(e.key==="ArrowRight"){seek(Math.min(1,(au.currentTime+5)/d));e.preventDefault()}else if(e.key==="ArrowLeft"){seek(Math.max(0,(au.currentTime-5)/d));e.preventDefault()}else if(e.key===" "||e.key==="Enter"){$("play").click();e.preventDefault()}});
  var spds=document.querySelectorAll(".spd");
  for(var i=0;i<spds.length;i++)spds[i].addEventListener("click",function(){rate=parseFloat(this.getAttribute("data-r"))||1;au.playbackRate=rate;for(var j=0;j<spds.length;j++)spds[j].setAttribute("aria-pressed",spds[j]===this?"true":"false")});
  $("dl").addEventListener("click",function(){if(state&&state.url)openLink(state.url)});
  size();
})();
</script>
</body>
</html>
